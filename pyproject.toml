[project]
name = "law-and-order"
version = "0.1.0"
description = "Protocol Infiltration Agent: deterministic arbitration protocols for digital networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
reddit = ["asyncpraw>=7.7"]
slack = ["slack-bolt>=1.18"]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/law_and_order"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
